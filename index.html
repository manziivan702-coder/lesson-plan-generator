.step {
  background: #f8fbff;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  border-left: 5px solid #0077b6;
}

h3 {
  color: #0077b6;
}<div class="container">

  <h2>📘 REB CBC Lesson Planner</h2>

  <div class="step">

    <h3>Step 1: Teacher Information</h3>

    <label>Teacher Name</label>
    <input type="text" id="teacher">

    <label>School Name</label>
    <input type="text" id="school">

    <label>Class</label>
    <select id="level">
      <option>P4</option>
      <option>P5</option>
      <option>P6</option>
    </select>

  </div>

  <div class="step">

    <h3>Step 2: Subject & Unit</h3>

    <label>Subject</label>
    <select id="subject" onchange="loadUnits()">
      <option value="">Select Subject</option>
      <option value="math">Mathematics</option>
      <option value="english">English</option>
      <option value="science">Science</option>
      <option value="sst">Social Studies</option>
    </select>

    <label>Unit</label>
    <select id="unit"></select>

  </div>

  <div class="step">

    <h3>Step 3: Teaching Setup</h3>

    <label>Number of Learners</label>
    <input type="number" id="learners">

    <label>Duration</label>
    <select id="duration">
      <option>40 Minutes</option>
      <option>80 Minutes</option>
    </select>

    <label>Teaching Technique</label>
    <select id="method">
      <option>Group Discussion</option>
      <option>Brainstorming</option>
      <option>Role Play</option>
      <option>Project Based</option>
    </select>

  </div>

  <button onclick="generate()">
    Generate CBC Lesson Plan
  </button>

  <br><br>

  <button onclick="downloadPDF()">
    Download PDF
  </button>

  <hr>

  <pre id="output"></pre>

</div>
