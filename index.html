<!DOCTYPE html>
<html>
<head>
  <title>REB CBC Lesson Planner</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
      background: #f4f7fb;
    }

    .sidebar {
      width: 250px;
      background: #003366;
      color: white;
      padding: 20px;
    }

    .step-btn {
      padding: 12px;
      margin-bottom: 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
      cursor: pointer;
    }

    .step-btn.active {
      background: #0055aa;
    }

    .content {
      flex: 1;
      padding: 30px;
      background: white;
      overflow-y: auto;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 15px;
      background: #003366;
      color: white;
      border: none;
      cursor: pointer;
      margin-right: 10px;
    }

    pre {
      background: #f1f1f1;
      padding: 15px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>📘 REB CBC</h2>

  <div class="step-btn active" onclick="goStep(0)">Basic Info</div>
  <div class="step-btn" onclick="goStep(1)">Academic</div>
  <div class="step-btn" onclick="goStep(2)">Unit & Lesson</div>
  <div class="step-btn" onclick="goStep(3)">Class Info</div>
  <div class="step-btn" onclick="goStep(4)">Strategy</div>
  <div class="step-btn" onclick="goStep(5)">Output</div>
</div>

<!-- CONTENT -->
<div class="content">

  <div class="step active">
    <h3>Basic Info</h3>
    <input id="school" placeholder="School Name">
    <input id="teacher" placeholder="Teacher Name">
  </div>

  <div class="step">
    <h3>Academic</h3>

    <select id="level" onchange="loadSubjects(this.value)">
      <option>Lower Primary</option>
      <option>Upper Primary</option>
    </select>

    <select id="subject" onchange="loadUnits()"></select>

    <select id="unit" onchange="loadLessons()"></select>

    <select id="lesson"></select>
  </div>

  <div class="step">
    <h3>Class Info</h3>
    <input id="learners" placeholder="Number of learners">
  </div>

  <div class="step">
    <h3>Strategy</h3>
    <select id="strategy">
      <option>Group Work</option>
      <option>Discussion</option>
      <option>Role Play</option>
    </select>
  </div>

  <div class="step">
    <h3>Output</h3>
    <button onclick="generate()">Generate Lesson Plan</button>
    <button onclick="downloadPDF()">Download PDF</button>

    <pre id="output"></pre>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
