<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SLP Platform</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f5f7fb;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      background:white;
      width:100%;
      max-width:500px;
      padding:50px 30px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
      text-align:center;
    }

    h1{
      font-size:40px;
      color:#222;
      margin-bottom:15px;
    }

    p{
      color:#666;
      line-height:1.7;
      margin-bottom:35px;
      font-size:17px;
    }

    .btn-group{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    button{
      width:100%;
      padding:16px;
      border:none;
      border-radius:12px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s ease;
    }

    .primary-btn{
      background:linear-gradient(135deg,#4f46e5,#06b6d4);
      color:white;
    }

    .primary-btn:hover{
      transform:translateY(-2px);
      opacity:0.95;
    }

    .whatsapp-btn{
      background:#25D366;
      color:white;
    }

    .whatsapp-btn:hover{
      opacity:0.9;
    }

    .secondary-btn{
      background:white;
      border:2px solid #ddd;
      color:#333;
    }

    .secondary-btn:hover{
      background:#f3f4f6;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>SLP Platform</h1>

    <p>
      Welcome to Smart Lesson Plan Platform.<br>
      Create professional lesson plans easily.
    </p>

    <div class="btn-group">

      <button class="primary-btn">
        Get Started
      </button>

      <a href="https://wa.me/250794666702" target="_blank">
        <button class="whatsapp-btn">
          WhatsApp Support
        </button>
      </a>

      <button class="secondary-btn">
        Register
      </button>

      <button class="secondary-btn">
        User Guide
      </button>

    </div>

  </div>

</body>

</html>
