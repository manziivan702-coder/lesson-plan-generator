<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>REB Lesson Plan Generator</title>

<style>
body{
  font-family: Arial;
  background:#f4f6f8;
  margin:0;
  padding:20px;
}

.container{
  max-width:850px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0px 4px 15px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
}

input, select, textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:6px;
}

button{
  width:100%;
  padding:12px;
  background:#2ecc71;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#27ae60;
}

.result{
  margin-top:20px;
  padding:15px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fff;
}
</style>
</head>

<body>

<div class="container">

<h2>REB Lesson Plan Generator</h2>

<!-- BASIC INFO -->
<input id="teacher" placeholder="Teacher Name">
<input id="school" placeholder="School">
<input id="subject" placeholder="Subject">

<select id="class">
  <option>S1</option><option>S2</option><option>S3</option>
  <option>S4</option><option>S5</option><option>S6</option>
</select>

<select id="term">
  <option>Term I</option>
  <option>Term II</option>
  <option>Term III</option>
</select>

<input id="date" type="date">
<input id="duration" placeholder="Duration (minutes)">

<!-- LESSON INFO -->
<input id="unit" placeholder="Unit">
<input id="lessonNo" placeholder="Lesson Number">
<input id="topic" placeholder="Topic">
<input id="subtopic" placeholder="Sub-topic">

<!-- REB CORE -->
<textarea id="competency" placeholder="Key Competency"></textarea>
<textarea id="crosscutting" placeholder="Cross-cutting Issues"></textarea>
<textarea id="previous" placeholder="Previous Knowledge"></textarea>

<!-- OBJECTIVES -->
<textarea id="generalObj" placeholder="General Objective"></textarea>
<textarea id="specificObj" placeholder="Specific Objectives"></textarea>

<!-- TEACHING -->
<textarea id="materials" placeholder="Teaching Materials"></textarea>
<textarea id="references" placeholder="References"></textarea>

<!-- LESSON FLOW -->
<textarea id="intro" placeholder="Introduction Activities"></textarea>
<textarea id="development" placeholder="Development Activities"></textarea>
<textarea id="conclusion" placeholder="Conclusion Activities"></textarea>

<!-- ASSESSMENT -->
<textarea id="assessment" placeholder="Assessment"></textarea>

<!-- REFLECTION -->
<textarea id="reflection" placeholder="Teacher Reflection"></textarea>

<button onclick="generate()">Generate Lesson Plan</button>

<div id="result" class="result"></div>

</div>

<script>
function generate(){

document.getElementById("result").innerHTML = `
<h3>REB LESSON PLAN</h3>

<p><b>Teacher:</b> ${teacher.value}</p>
<p><b>School:</b> ${school.value}</p>
<p><b>Subject:</b> ${subject.value}</p>
<p><b>Class:</b> ${class.value}</p>
<p><b>Term:</b> ${term.value}</p>
<p><b>Date:</b> ${date.value}</p>
<p><b>Duration:</b> ${duration.value}</p>

<hr>

<p><b>Unit:</b> ${unit.value}</p>
<p><b>Lesson No:</b> ${lessonNo.value}</p>
<p><b>Topic:</b> ${topic.value}</p>
<p><b>Sub-topic:</b> ${subtopic.value}</p>

<hr>

<p><b>Competency:</b><br>${competency.value}</p>
<p><b>Cross-cutting Issues:</b><br>${crosscutting.value}</p>
<p><b>Previous Knowledge:</b><br>${previous.value}</p>

<hr>

<p><b>General Objective:</b><br>${generalObj.value}</p>
<p><b>Specific Objectives:</b><br>${specificObj.value}</p>

<hr>

<p><b>Materials:</b><br>${materials.value}</p>
<p><b>References:</b><br>${references.value}</p>

<hr>

<p><b>Introduction:</b><br>${intro.value}</p>
<p><b>Development:</b><br>${development.value}</p>
<p><b>Conclusion:</b><br>${conclusion.value}</p>

<hr>

<p><b>Assessment:</b><br>${assessment.value}</p>
<p><b>Reflection:</b><br>${reflection.value}</p>
`;
}
</script>

</body>
</html>
